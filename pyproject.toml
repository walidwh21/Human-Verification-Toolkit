[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "humancheck"
version = "1.0.0"
description = "General-purpose human-verification toolkit with themed profiles"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["Pillow>=10.0", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["playwright"]

[project.scripts]
humancheck = "humancheck.cli:main"

[tool.setuptools.packages.find]
include = ["humancheck*"]

[tool.setuptools.package-data]
humancheck = ["static/*"]
